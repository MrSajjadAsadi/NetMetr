name: Build Windows Application

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build & Package Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore Dependencies
        run: dotnet restore windows/NetMetr/NetMetr.csproj

      - name: Build & Publish Single-File Executable
        run: >
          dotnet publish windows/NetMetr/NetMetr.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish/

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetMetr-Windows-x64
          path: publish/NetMetr.exe
          if-no-files-found: error
          retention-days: 30
